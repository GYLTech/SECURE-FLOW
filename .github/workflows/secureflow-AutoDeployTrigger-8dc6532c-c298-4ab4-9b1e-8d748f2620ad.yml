name: Trigger auto deployment for secureflow

on:
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/secureflow-AutoDeployTrigger-8dc6532c-c298-4ab4-9b1e-8d748f2620ad.yml'

  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SECUREFLOW_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SECUREFLOW_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SECUREFLOW_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: secureflow.azurecr.io
          registryUsername: ${{ secrets.SECUREFLOW_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SECUREFLOW_REGISTRY_PASSWORD }}
          containerAppName: secureflow
          resourceGroup: RSSL-Common-RG
          imageToBuild: secureflow.azurecr.io/secureflow:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


